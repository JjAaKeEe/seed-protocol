name: Experiment
description: Propose a reproducible way to reduce uncertainty.
title: "[Experiment] "
labels: ["experiment"]
body:
  - type: input
    id: question
    attributes:
      label: Question or hypothesis
    validations: {required: true}
  - type: textarea
    id: method
    attributes:
      label: Proposed method
    validations: {required: true}
  - type: textarea
    id: success
    attributes:
      label: Success and failure criteria
    validations: {required: true}
  - type: textarea
    id: artifacts
    attributes:
      label: Evidence and artifacts to preserve
  - type: textarea
    id: authority
    attributes:
      label: Safety, authority, or resource constraints
